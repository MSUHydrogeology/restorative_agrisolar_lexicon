name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
# The group is keyed per pull request and per branch, so that a push to main
# cancels only the previous main run. A single shared group meant any push to
# main also cancelled the build check running on an open pull request, and
# branch protection requires that check to pass before the PR can merge.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The PDF is built with Typst, which ships inside Quarto and reads the SVG
      # figures directly, so there is no LaTeX distribution or SVG converter to
      # install. The version is pinned to the one the book is written against:
      # each Quarto release bundles its own Typst and orange-book, and the PDF
      # template in typst/ is written against these.
      #
      # GH_TOKEN authenticates the release lookup, which an anonymous request
      # from a shared runner IP can have rate-limited with a 403.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 1.9.38

      - name: Render (HTML + PDF)
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy only for pushes to main (a merged PR is a push to main).
  # Pull requests run the build job above as a render check but do not deploy.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
