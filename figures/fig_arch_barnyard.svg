<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img">
<title>Barnyard Shelter Solar</title>
<desc>Section through a farmyard, drawn at twenty SVG units to the meter, the closest view in the set. Three tall rows stand over the paddock the herd already uses, high enough for cattle to walk beneath, with a cable running back to the barn whose load they offset. Sunlight falls from the upper left, and the herd stands in the shade the panels throw. Beneath that shaded ground the soil is compacted where the animals crowd, which is the tradeoff this archetype carries. Its outcomes footprint sits at the right: Agriculture nearest the rim, Ecology in toward the center.</desc>

<defs>
  <!-- Shared glyphs. The module is one 3.0 m table, drawn at each figure's own
       scale via transform="... scale(k)". Post height is per instance, because
       clearance is a real design variable. Read heights against the bar scale. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="cow">
    <rect x="-16" y="-22" width="32" height="13" rx="5" fill="#ffffff" stroke="#3d3a34" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <path d="M16,-20 q8,-1 9,3 q1,4 -3,5 l-6,0" fill="#ffffff" stroke="#3d3a34" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line x1="-11" y1="-9" x2="-11" y2="0" stroke="#3d3a34" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line x1="-4" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line x1="7" y1="-9" x2="7" y2="0" stroke="#3d3a34" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line x1="13" y1="-9" x2="13" y2="0" stroke="#3d3a34" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <path d="M-16,-20 q-5,3 -3,9" fill="none" stroke="#3d3a34" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="tuft">
    <line x1="0" y1="0" x2="-4.5" y2="-10" stroke="#8a9464" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#8a9464" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="4.5" y2="-10" stroke="#8a9464" stroke-width="1.4"/>
  </g>
  <clipPath id="soilclipB">
    <path d="M26,214 L545,214 L545,252 L26,252 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#6f6d66" font-size="12.5">A1 scale · S1 farming · ownership-led restoration</text>

<!-- sun: fixed position and 45 degree rays in every archetype card -->
<g stroke="#c08a12" stroke-linecap="round">
  <circle cx="62" cy="60" r="8.5" fill="#c08a12" fill-opacity="0.16" stroke-width="1.4"/>
  <g stroke-width="1.6" opacity="0.85">
    <line x1="63" y1="75" x2="72" y2="84"/>
    <line x1="70" y1="68" x2="79" y2="77"/>
    <line x1="77" y1="61" x2="86" y2="70"/>
  </g>
</g>

<!-- ================= soil ================= -->
<path d="M26,214 L545,214 L545,252 L26,252 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclipB)">
  <path d="M26,214 L545,214 L545,224 L26,224 Z" fill="#e0d5bd"/>
  <!-- compacted, poached ground under the shade the herd stands in -->
  <path d="M362,214 L545,214 L545,234 L362,234 Z" fill="#c9bb9c"/>
  <g fill="#a89a79" opacity="0.85">
    <circle cx="378" cy="222" r="1.2"/><circle cx="400" cy="229" r="1.2"/><circle cx="422" cy="219" r="1.2"/>
    <circle cx="444" cy="230" r="1.2"/><circle cx="466" cy="221" r="1.2"/><circle cx="488" cy="228" r="1.2"/>
    <circle cx="510" cy="220" r="1.2"/><circle cx="532" cy="229" r="1.2"/><circle cx="390" cy="232" r="1.2"/>
    <circle cx="456" cy="224" r="1.2"/><circle cx="520" cy="232" r="1.2"/>
  </g>
</g>
<path d="M26,214 L545,214" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= the barn ================= -->
<polygon points="60,214 60,144 140,74 220,144 220,214" fill="#ffffff" stroke="#6b6b63" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M60,144 L140,74 L220,144" fill="none" stroke="#6b6b63" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="122" y="176" width="36" height="38" fill="none" stroke="#6b6b63" stroke-width="1.4"/>
<line x1="140" y1="176" x2="140" y2="214" stroke="#6b6b63" stroke-width="1.1"/>

<!-- the cable back to the load it offsets -->
<path d="M320,168 L240,168 L224,168" fill="none" stroke="#c08a12" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="224" cy="168" r="3" fill="none" stroke="#c08a12" stroke-width="1.3"/>

<!-- ================= shade, and the ground that pays for it ================= -->
<g fill="#3d4a55" opacity="0.17">
  <path d="M362,214 L545,214 L545,222 L362,222 Z"/>
</g>

<g>
  <use href="#tuft" x="252" y="214"/><use href="#tuft" x="284" y="214"/><use href="#tuft" x="316" y="214"/>
  <use href="#tuft" x="348" y="214"/>
</g>
<g stroke="#b6a274" stroke-width="1.1" opacity="0.85">
  <path d="M252,214 v9"/><path d="M316,214 v9"/>
</g>

<!-- ================= the array: three rows, high enough to walk a cow under ================= -->
<line x1="320" y1="214" x2="320" y2="130" stroke="#6b6b63" stroke-width="2.4"/>
<use href="#module" transform="translate(320,130) scale(1.364)"/>
<line x1="400" y1="214" x2="400" y2="130" stroke="#6b6b63" stroke-width="2.4"/>
<use href="#module" transform="translate(400,130) scale(1.364)"/>
<line x1="480" y1="214" x2="480" y2="130" stroke="#6b6b63" stroke-width="2.4"/>
<use href="#module" transform="translate(480,130) scale(1.364)"/>

<!-- the herd, standing where the shade is -->
<use href="#cow" transform="translate(388,214) scale(1.5)"/>
<use href="#cow" transform="translate(452,214) scale(1.5)"/>
<use href="#cow" transform="translate(516,214) scale(1.5)"/>

<text x="140" y="240" fill="#8a7f6a" font-size="12" font-style="italic" text-anchor="middle">the parlor it offsets</text>
<text x="418" y="94" fill="#6a7a52" font-size="12" font-style="italic" text-anchor="middle"><tspan x="418">shade the herd already seeks,</tspan><tspan x="418" dy="15">and the wear that follows it</tspan></text>

<!-- bar scale -->
<g stroke="#8a7f6a" stroke-width="1.2" fill="none">
  <path d="M26,258 h100"/><path d="M26,254 v8"/><path d="M126,254 v8"/>
</g>
<text x="133" y="261.5" fill="#8a7f6a" font-size="11">5 m</text>

<!-- ================= outcomes footprint =================
     Same four domains, quadrants, and colors as the full footprint in
     fig_outcomes_footprint.svg: Ecology upper left, Communities upper right,
     Agriculture lower right, Water lower left. Rim is benefit, center harm. -->
<path d="M668,140 L614,140 A54,54 0 0 1 668,86 Z" fill="#639922" fill-opacity="0.08"/>
<path d="M668,140 L668,86 A54,54 0 0 1 722,140 Z" fill="#2f7f70" fill-opacity="0.08"/>
<path d="M668,140 L722,140 A54,54 0 0 1 668,194 Z" fill="#a8894f" fill-opacity="0.08"/>
<path d="M668,140 L668,194 A54,54 0 0 1 614,140 Z" fill="#4f86a8" fill-opacity="0.08"/>
<g stroke="#ffffff" stroke-width="1.6"><line x1="614" y1="140" x2="722" y2="140"/><line x1="668" y1="86" x2="668" y2="194"/></g>
<circle cx="668" cy="140" r="54" fill="none" stroke="#d3d1c7" stroke-width="1.1"/>
<circle cx="668" cy="140" r="18" fill="none" stroke="#e2e0d8" stroke-width="1"/>
<circle cx="668" cy="140" r="36" fill="none" stroke="#9c988e" stroke-width="1.3" stroke-dasharray="4 3"/>
<g stroke="#e2e0d8" stroke-width="1">
  <line x1="668" y1="140" x2="629.8" y2="101.8"/>
  <line x1="668" y1="140" x2="706.2" y2="101.8"/>
  <line x1="668" y1="140" x2="706.2" y2="178.2"/>
  <line x1="668" y1="140" x2="629.8" y2="178.2"/>
</g>
<polygon points="649.6,121.6 699.1,108.9 701.9,173.9 645.4,162.6" fill="#6f6d66" fill-opacity="0.16" stroke="#6f6d66" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="649.6" cy="121.6" r="2.6" fill="#6f6d66"/>
<circle cx="699.1" cy="108.9" r="2.6" fill="#6f6d66"/>
<circle cx="701.9" cy="173.9" r="2.6" fill="#6f6d66"/>
<circle cx="645.4" cy="162.6" r="2.6" fill="#6f6d66"/>
<text x="620" y="96" fill="#639922" font-size="12.5" font-weight="700" text-anchor="end">Ecology</text>
<text x="716" y="96" fill="#2f7f70" font-size="12.5" font-weight="700" text-anchor="start">Communities</text>
<text x="716" y="194" fill="#a8894f" font-size="12.5" font-weight="700" text-anchor="start">Agriculture</text>
<text x="620" y="194" fill="#4f86a8" font-size="12.5" font-weight="700" text-anchor="end">Water</text>
<text x="668" y="236" fill="#6f6d66" font-size="12" font-style="italic" text-anchor="middle">benefit at the rim, harm at the center</text>
<text x="668" y="250" fill="#7a7973" font-size="12" font-style="italic" text-anchor="middle">dashed ring: no harm either way</text>
</svg>
