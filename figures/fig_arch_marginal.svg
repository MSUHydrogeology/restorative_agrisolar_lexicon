<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Marginal Land Solar</title>
<desc>Section through a farm field, drawn at ten SVG units to the meter. On the level, well drained ground at left the crop stands full height, then thins and yellows toward the shoulder, with one stand gap, as the water table rises and the soil thins. Production stops at the parcel boundary and the array takes the wet, stony corner, which carries rough grass over shallow roots. Sunlight falls from the upper left, and the panels throw spaced bands of shade onto the ground. Its outcomes footprint sits at the right: Communities, Ecology, and Water all well out toward the rim, with Agriculture the one pulled in.</desc>

<defs>
  <!-- Shared glyphs. The module is one 3.0 m table, drawn at each figure's own
       scale via transform="... scale(k)". Post height is per instance, because
       clearance is a real design variable. Read heights against the bar scale. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="crop">
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#6a9440" stroke-width="1.5"/>
    <line x1="0" y1="-5" x2="-3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
    <line x1="0" y1="-5" x2="3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
  </g>
  <!-- the same plant, losing height and color toward the wet shoulder -->
  <g id="crop-82">
    <line x1="0" y1="0" x2="0" y2="-8.2" stroke="#6a9440" stroke-width="1.5"/>
    <line x1="0" y1="-4.6" x2="-3.2" y2="-8.2" stroke="#6a9440" stroke-width="1.2"/>
    <line x1="0" y1="-4.6" x2="3.2" y2="-8.2" stroke="#6a9440" stroke-width="1.2"/>
  </g>
  <g id="crop-70">
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#809642" stroke-width="1.5"/>
    <line x1="0" y1="-3.9" x2="-2.7" y2="-7" stroke="#809642" stroke-width="1.2"/>
    <line x1="0" y1="-3.9" x2="2.7" y2="-7" stroke="#809642" stroke-width="1.2"/>
  </g>
  <g id="crop-54">
    <line x1="0" y1="0" x2="0" y2="-5.4" stroke="#9c9848" stroke-width="1.5"/>
    <line x1="0" y1="-3.0" x2="-2.1" y2="-5.4" stroke="#9c9848" stroke-width="1.5"/>
    <line x1="0" y1="-3.0" x2="2.1" y2="-5.4" stroke="#9c9848" stroke-width="1.5"/>
  </g>
  <g id="tuft">
    <line x1="0" y1="0" x2="-3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
  </g>
  <clipPath id="soilclip">
    <path d="M26,172 L170,172 L230,204 L545,209 L545,250 L26,250 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A2–A3 scale · S4 farming · siting-led restoration</text>

<!-- sun: fixed position and 45 degree rays in every archetype card -->
<g stroke="#c08a12" stroke-linecap="round">
  <circle cx="62" cy="60" r="8.5" fill="#c08a12" fill-opacity="0.16" stroke-width="1.4"/>
  <g stroke-width="1.6" opacity="0.85">
    <line x1="63" y1="75" x2="72" y2="84"/>
    <line x1="70" y1="68" x2="79" y2="77"/>
    <line x1="77" y1="61" x2="86" y2="70"/>
  </g>
</g>

<!-- ================= soil ================= -->
<path d="M26,172 L170,172 L230,204 L545,209 L545,250 L26,250 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclip)">
  <!-- topsoil: deep and even under the field, thin over the corner -->
  <path d="M26,172 L170,172 L230,204 L545,209 L545,217 L230,214 L170,186 L26,186 Z" fill="#e0d5bd"/>
  <!-- stone -->
  <path d="M300,232 l14,-6 l13,5 l-4,11 l-16,2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M392,244 l17,-5 l12,7 l-9,9 l-17,-2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M462,230 l11,-5 l10,6 l-6,8 l-13,-1 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M508,242 l12,-4 l9,6 l-6,8 l-14,-2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <!-- water table: far below the good field, close under the corner -->
  <path d="M26,244 L170,243 L230,230 L545,227" fill="none" stroke="#2b7fb0" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.75"/>
</g>
<path d="M26,172 L170,172 L230,204 L545,209" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= the crop, falling away toward the shoulder ================= -->
<g>
  <use href="#crop" x="44" y="172"/><use href="#crop" x="66" y="172"/><use href="#crop" x="88" y="172"/>
  <use href="#crop-82" x="110" y="172"/><use href="#crop-70" x="132" y="172"/>
  <use href="#crop-54" x="176" y="175.2"/>
</g>
<!-- rooting depth tapers with the stand -->
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M44,172 v10"/><path d="M88,172 v10"/><path d="M110,172 v8"/>
  <path d="M132,172 v6"/><path d="M176,175.2 v4"/>
</g>

<!-- ================= the corner that never paid ================= -->
<g>
  <use href="#tuft" x="240" y="204.2"/><use href="#tuft" x="264" y="204.5"/><use href="#tuft" x="288" y="204.9"/>
  <use href="#tuft" x="312" y="205.3"/><use href="#tuft" x="336" y="205.7"/><use href="#tuft" x="360" y="206.1"/>
  <use href="#tuft" x="384" y="206.4"/><use href="#tuft" x="408" y="206.8"/><use href="#tuft" x="432" y="207.2"/>
  <use href="#tuft" x="456" y="207.6"/><use href="#tuft" x="480" y="208.0"/><use href="#tuft" x="504" y="208.4"/>
  <use href="#tuft" x="528" y="208.7"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M240,204.2 v5"/><path d="M312,205.3 v5"/><path d="M384,206.4 v5"/>
  <path d="M456,207.6 v5"/><path d="M528,208.7 v5"/>
</g>
<ellipse cx="420" cy="207" rx="58" ry="3.4" fill="#2b7fb0" opacity="0.28"/>

<!-- shade cast onto the ground, spaced by the row pitch -->
<g fill="#3d4a55" opacity="0.16">
  <path d="M267.9,204.8 L310.1,205.5 L310.1,211.5 L267.9,210.8 Z"/>
  <path d="M337.9,205.9 L380.1,206.6 L380.1,212.6 L337.9,211.9 Z"/>
  <path d="M407.9,207.0 L450.1,207.7 L450.1,213.7 L407.9,213.0 Z"/>
  <path d="M477.9,208.1 L520.1,208.8 L520.1,214.8 L477.9,214.1 Z"/>
</g>

<!-- the array: five rows, the last one cut by the frame because the corner runs on -->
<line x1="265" y1="204.6" x2="265" y2="180.6" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(265,180.6) scale(0.682)"/>
<line x1="335" y1="205.7" x2="335" y2="181.7" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(335,181.7) scale(0.682)"/>
<line x1="405" y1="206.8" x2="405" y2="182.8" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(405,182.8) scale(0.682)"/>
<line x1="475" y1="207.9" x2="475" y2="183.9" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(475,183.9) scale(0.682)"/>
<line x1="545" y1="209" x2="545" y2="185" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(545,185) scale(0.682)"/>

<!-- parcel boundary: production stops here as a decision, not a fade -->
<path d="M196,182 v-24" stroke="#a89c80" stroke-width="1.2" stroke-dasharray="3 3"/>

<text x="104" y="150" fill="#6a7a52" font-size="11" font-style="italic" text-anchor="middle">the field keeps farming</text>
<text x="378" y="164" fill="#8a7f6a" font-size="11" font-style="italic" text-anchor="middle">ground that never paid its way</text>

<!-- bar scale -->
<g stroke="#8a7f6a" stroke-width="1.2" fill="none">
  <path d="M26,258 h100"/><path d="M26,254 v8"/><path d="M126,254 v8"/>
</g>
<text x="133" y="261.5" fill="#8a7f6a" font-size="9.5">10 m</text>

<!-- ================= outcomes footprint ================= -->
<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#8a8880" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Ecology</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Water</text>

<polygon points="690,106 726,150 690,194 646,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="106" r="2.2" fill="#2c5580"/>
<circle cx="726" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="194" r="2.2" fill="#2c5580"/>
<circle cx="646" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="234" fill="#7a7973" font-size="9.5" font-style="italic" text-anchor="middle">benefit at the rim, harm at the center</text>
<text x="690" y="246" fill="#8a8880" font-size="9" font-style="italic" text-anchor="middle">dashed ring: no harm either way</text>
</svg>
