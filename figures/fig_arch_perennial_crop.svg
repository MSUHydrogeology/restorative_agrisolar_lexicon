<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img">
<title>Perennial Crop Canopy</title>
<desc>Section through a perennial fruit planting, drawn at twelve and a half SVG units to the meter. Six crop rows stand on their own trellis, each with one row of panels carried above it rather than between, high enough to clear the canopy and the machinery. The roots run deep and unbroken beneath, because the planting is never lifted between harvests, and the trellis that holds the crop was already there before the array. Sunlight falls from the upper left, so the shade bands land in the alleys rather than under the panels that cast them. Its outcomes footprint sits at the right: Agriculture nearest the rim, Water and Communities outside the ring, Ecology just inside it.</desc>
<defs>
  <!-- Shared glyphs. The module is one 3.0 m table, drawn at each figure's own
       scale via transform="... scale(k)". Post height is per instance, because
       clearance is a real design variable. Read heights against the bar scale. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="perennial">
    <line x1="0" y1="0" x2="0" y2="-17" stroke="#7a6242" stroke-width="2.6"/>
    <path d="M-4,-11 h8 M-4,-19 h8" stroke="#9a9288" stroke-width="1" fill="none"/>
    <path d="M0,-17 q-5,-7 -11,-10 M0,-17 q5,-7 11,-10" stroke="#7a6242" stroke-width="1.6" fill="none"/>
    <ellipse cx="0" cy="-27" rx="14" ry="11" fill="#4f8a2e" fill-opacity="0.92"/>
    <ellipse cx="-9" cy="-21" rx="8" ry="6.5" fill="#4f8a2e" fill-opacity="0.85"/>
    <ellipse cx="9" cy="-21" rx="8" ry="6.5" fill="#4f8a2e" fill-opacity="0.85"/>
    <circle cx="-5" cy="-25" r="1.8" fill="#b5432e"/>
    <circle cx="6.5" cy="-29" r="1.8" fill="#b5432e"/>
    <circle cx="1" cy="-19" r="1.8" fill="#b5432e"/>
    <circle cx="-9" cy="-31" r="1.8" fill="#b5432e"/>
  </g>
  <g id="roots">
    <path d="M0,0 v27 M0,8 q-9,4 -13,15 M0,8 q9,4 13,15 M0,17 q-6,3 -8,11 M0,17 q6,3 8,11"
          stroke="#a8875c" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>
  <clipPath id="soilclipP">
    <path d="M26,200 L545,200 L545,250 L26,250 Z"/>
  </clipPath>
  <clipPath id="bandclipP">
    <path d="M26,196 L545,196 L545,212 L26,212 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#6f6d66" font-size="12.5">A2–A4 scale · S1 farming · structure-led restoration</text>

<!-- sun: fixed position and 45 degree rays in every archetype card -->
<g stroke="#c08a12" stroke-linecap="round">
  <circle cx="62" cy="60" r="8.5" fill="#c08a12" fill-opacity="0.16" stroke-width="1.4"/>
  <g stroke-width="1.6" opacity="0.85">
    <line x1="63" y1="75" x2="72" y2="84"/>
    <line x1="70" y1="68" x2="79" y2="77"/>
    <line x1="77" y1="61" x2="86" y2="70"/>
  </g>
</g>

<path d="M26,200 L545,200 L545,250 L26,250 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclipP)">
  <path d="M26,200 L545,200 L545,213 L26,213 Z" fill="#e0d5bd"/>
  <!-- the roots are the point: a planting that is never lifted keeps them -->
  <use href="#roots" x="70" y="200"/>
  <use href="#roots" x="160" y="200"/>
  <use href="#roots" x="250" y="200"/>
  <use href="#roots" x="340" y="200"/>
  <use href="#roots" x="430" y="200"/>
  <use href="#roots" x="520" y="200"/>
</g>
<path d="M26,200 L545,200" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>
<g fill="#3d4a55" opacity="0.2" clip-path="url(#bandclipP)">
  <path d="M111.3,200 h37.5 v7 h-37.5 z"/>
  <path d="M201.3,200 h37.5 v7 h-37.5 z"/>
  <path d="M291.3,200 h37.5 v7 h-37.5 z"/>
  <path d="M381.3,200 h37.5 v7 h-37.5 z"/>
  <path d="M471.3,200 h37.5 v7 h-37.5 z"/>
  <path d="M561.3,200 h37.5 v7 h-37.5 z"/>
</g>
<use href="#perennial" x="70" y="200"/>
<use href="#perennial" x="160" y="200"/>
<use href="#perennial" x="250" y="200"/>
<use href="#perennial" x="340" y="200"/>
<use href="#perennial" x="430" y="200"/>
<use href="#perennial" x="520" y="200"/>
<line x1="70" y1="200" x2="70" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(70,140) scale(0.852)"/>
<line x1="160" y1="200" x2="160" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(160,140) scale(0.852)"/>
<line x1="250" y1="200" x2="250" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(250,140) scale(0.852)"/>
<line x1="340" y1="200" x2="340" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(340,140) scale(0.852)"/>
<line x1="430" y1="200" x2="430" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(430,140) scale(0.852)"/>
<line x1="520" y1="200" x2="520" y2="140" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(520,140) scale(0.852)"/>
<text x="205" y="112" fill="#8a7f6a" font-size="12" font-style="italic" text-anchor="middle">one panel row per crop row</text>
<text x="404" y="243" fill="#a8875c" font-size="12" font-style="italic" text-anchor="middle">roots stay down for the life of the array</text>
<g stroke="#8a7f6a" stroke-width="1.2" fill="none">
  <path d="M26,258 h100"/><path d="M26,254 v8"/><path d="M126,254 v8"/>
</g>
<text x="133" y="261.5" fill="#8a7f6a" font-size="11">8 m</text>
<!-- ================= outcomes footprint =================
     Same four domains, quadrants, and colors as the full footprint in
     fig_outcomes_footprint.svg: Ecology upper left, Communities upper right,
     Agriculture lower right, Water lower left. Rim is benefit, center harm. -->
<path d="M668,140 L614,140 A54,54 0 0 1 668,86 Z" fill="#639922" fill-opacity="0.08"/>
<path d="M668,140 L668,86 A54,54 0 0 1 722,140 Z" fill="#2f7f70" fill-opacity="0.08"/>
<path d="M668,140 L722,140 A54,54 0 0 1 668,194 Z" fill="#a8894f" fill-opacity="0.08"/>
<path d="M668,140 L668,194 A54,54 0 0 1 614,140 Z" fill="#4f86a8" fill-opacity="0.08"/>
<g stroke="#ffffff" stroke-width="1.6"><line x1="614" y1="140" x2="722" y2="140"/><line x1="668" y1="86" x2="668" y2="194"/></g>
<circle cx="668" cy="140" r="54" fill="none" stroke="#d3d1c7" stroke-width="1.1"/>
<circle cx="668" cy="140" r="18" fill="none" stroke="#e2e0d8" stroke-width="1"/>
<circle cx="668" cy="140" r="36" fill="none" stroke="#9c988e" stroke-width="1.3" stroke-dasharray="4 3"/>
<g stroke="#e2e0d8" stroke-width="1">
  <line x1="668" y1="140" x2="629.8" y2="101.8"/>
  <line x1="668" y1="140" x2="706.2" y2="101.8"/>
  <line x1="668" y1="140" x2="706.2" y2="178.2"/>
  <line x1="668" y1="140" x2="629.8" y2="178.2"/>
</g>
<polygon points="644.7,116.7 694.9,113.1 703.4,175.4 638.3,169.7" fill="#6f6d66" fill-opacity="0.16" stroke="#6f6d66" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="644.7" cy="116.7" r="2.6" fill="#6f6d66"/>
<circle cx="694.9" cy="113.1" r="2.6" fill="#6f6d66"/>
<circle cx="703.4" cy="175.4" r="2.6" fill="#6f6d66"/>
<circle cx="638.3" cy="169.7" r="2.6" fill="#6f6d66"/>
<text x="620" y="96" fill="#639922" font-size="12.5" font-weight="700" text-anchor="end">Ecology</text>
<text x="716" y="96" fill="#2f7f70" font-size="12.5" font-weight="700" text-anchor="start">Communities</text>
<text x="716" y="194" fill="#a8894f" font-size="12.5" font-weight="700" text-anchor="start">Agriculture</text>
<text x="620" y="194" fill="#4f86a8" font-size="12.5" font-weight="700" text-anchor="end">Water</text>
<text x="668" y="236" fill="#6f6d66" font-size="12" font-style="italic" text-anchor="middle">benefit at the rim, harm at the center</text>
<text x="668" y="250" fill="#7a7973" font-size="12" font-style="italic" text-anchor="middle">dashed ring: no harm either way</text>
</svg>
