<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Solar Prairie Strips</title>
<desc>Section through a sloping crop field, drawn at eight SVG units to the meter. Five rows stand mid-slope on a contour band of deep-rooted native prairie, raised clear of the standing vegetation. The band intercepts runoff coming down the hill, traps sediment at its upslope edge, and carries roots far below the crop rooting depth so water moves downward instead of across. Flow leaving the strip is reduced. Sunlight falls from the upper left, and the rows throw bands of shade that run downslope. Its outcomes footprint sits at the right: Ecology and Water almost at the rim, Agriculture pulled in toward the center, which is the trade this form makes on purpose.</desc>

<defs>
  <!-- Shared glyphs. The module is one 3.0 m table, drawn at each figure's own
       scale via transform="... scale(k)". Post height is per instance, because
       clearance is a real design variable. Read heights against the bar scale. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="crop">
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#6a9440" stroke-width="1.4"/>
    <line x1="0" y1="-3.3" x2="-2.3" y2="-6" stroke="#6a9440" stroke-width="1.2"/>
    <line x1="0" y1="-3.3" x2="2.3" y2="-6" stroke="#6a9440" stroke-width="1.2"/>
  </g>
  <g id="prairie">
    <line x1="0" y1="0" x2="0" y2="-14.4" stroke="#4f7a34" stroke-width="1.5"/>
    <line x1="0" y1="-4.8" x2="-4.3" y2="-11.5" stroke="#4f7a34" stroke-width="1.2"/>
    <line x1="0" y1="-4.8" x2="4.3" y2="-11.5" stroke="#4f7a34" stroke-width="1.2"/>
    <line x1="0" y1="-9.6" x2="-3" y2="-16.3" stroke="#4f7a34" stroke-width="1.1"/>
    <line x1="0" y1="-9.6" x2="3" y2="-16.3" stroke="#4f7a34" stroke-width="1.1"/>
    <circle cx="0" cy="-15.8" r="1.5" fill="#4f7a34"/>
  </g>
  <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L9,5 L0,8.5 z" fill="#2b7fb0"/>
  </marker>
  <clipPath id="soilclip2">
    <path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,252 L26,252 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A3 scale · S5 farming · siting-led restoration</text>

<!-- sun: fixed position and 45 degree rays in every archetype card -->
<g stroke="#c08a12" stroke-linecap="round">
  <circle cx="62" cy="60" r="8.5" fill="#c08a12" fill-opacity="0.16" stroke-width="1.4"/>
  <g stroke-width="1.6" opacity="0.85">
    <line x1="63" y1="75" x2="72" y2="84"/>
    <line x1="70" y1="68" x2="79" y2="77"/>
    <line x1="77" y1="61" x2="86" y2="70"/>
  </g>
</g>

<!-- ================= soil ================= -->
<path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,252 L26,252 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclip2)">
  <path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,236 L430,224 L300,204 L150,174 L26,152 Z" fill="#e0d5bd"/>
  <!-- deep prairie roots, well past the crop rooting depth -->
  <g fill="none" stroke="#8a6f43" stroke-width="1.2" opacity="0.9">
    <path d="M208,173.6 C205,188 211,200 206,220"/>
    <path d="M236,179.2 C240,193 233,206 238,226"/>
    <path d="M264,184.8 C260,199 267,211 262,231"/>
    <path d="M292,190.4 C296,204 289,216 294,236"/>
    <path d="M320,195.1 C316,209 323,221 318,240"/>
    <path d="M348,199.4 C352,213 345,225 350,244"/>
    <path d="M376,203.7 C372,217 379,229 374,246"/>
    <path d="M404,208.0 C408,221 401,232 406,248"/>
    <path d="M432,212.2 C428,224 435,235 430,250"/>
  </g>
  <!-- water going down under the band instead of across the surface -->
  <g stroke="#2b7fb0" stroke-width="1.3" opacity="0.75" marker-end="url(#flow)">
    <path d="M250,192 v16"/><path d="M310,202 v16"/><path d="M370,211 v16"/><path d="M430,220 v16"/>
  </g>
</g>
<path d="M26,140 L150,162 L300,192 L430,212 L545,224" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- shade bands, running downslope from each row -->
<g fill="#3d4a55" opacity="0.17">
  <path d="M228.4,177.7 L268.1,185.6 L268.1,191.6 L228.4,183.7 Z"/>
  <path d="M284.4,188.9 L324.1,195.7 L324.1,201.7 L284.4,194.9 Z"/>
  <path d="M340.4,198.2 L380.1,204.3 L380.1,210.3 L340.4,204.2 Z"/>
  <path d="M396.4,206.8 L436.1,212.6 L436.1,218.6 L396.4,212.8 Z"/>
  <path d="M452.4,214.3 L492.1,218.5 L492.1,224.5 L452.4,220.3 Z"/>
</g>

<!-- ================= crop above and below the band ================= -->
<g>
  <use href="#crop" x="40" y="142.5"/><use href="#crop" x="58" y="145.7"/><use href="#crop" x="76" y="148.9"/>
  <use href="#crop" x="94" y="152.1"/><use href="#crop" x="112" y="155.3"/><use href="#crop" x="130" y="158.4"/>
  <use href="#crop" x="148" y="161.6"/><use href="#crop" x="166" y="165.2"/><use href="#crop" x="184" y="168.8"/>
  <use href="#crop" x="460" y="215.1"/><use href="#crop" x="478" y="217.0"/><use href="#crop" x="496" y="218.9"/>
  <use href="#crop" x="514" y="220.8"/><use href="#crop" x="532" y="222.6"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M40,142.5 v7"/><path d="M76,148.9 v7"/><path d="M112,155.3 v7"/><path d="M148,161.6 v7"/>
  <path d="M184,168.8 v7"/><path d="M478,217.0 v7"/><path d="M514,220.8 v7"/>
</g>

<!-- ================= runoff coming down the hill ================= -->
<g stroke="#2b7fb0" stroke-width="1.6" fill="none" marker-end="url(#flow)" opacity="0.85">
  <path d="M96,142 L146,152"/>
  <path d="M138,152 L188,162"/>
</g>
<text x="90" y="138" fill="#2b7fb0" font-size="11" font-style="italic" text-anchor="end">runoff</text>

<!-- what leaves the band, reduced -->
<g stroke="#2b7fb0" stroke-width="0.9" fill="none" marker-end="url(#flow)" opacity="0.65">
  <path d="M470,206 L512,210"/>
</g>

<!-- sediment caught at the upslope edge -->
<polygon points="182,168.4 202,172.4 197,161" fill="#d6c9ab" stroke="#a89a79" stroke-width="1.1"/>

<!-- ================= the contour band ================= -->
<g>
  <use href="#prairie" x="208" y="173.6"/><use href="#prairie" x="236" y="179.2"/><use href="#prairie" x="264" y="184.8"/>
  <use href="#prairie" x="292" y="190.4"/><use href="#prairie" x="320" y="195.1"/><use href="#prairie" x="348" y="199.4"/>
  <use href="#prairie" x="376" y="203.7"/><use href="#prairie" x="404" y="208.0"/><use href="#prairie" x="432" y="212.2"/>
</g>

<!-- five rows, raised clear of the standing prairie -->
<line x1="220" y1="176" x2="220" y2="152" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(220,152) scale(0.545)"/>
<line x1="276" y1="187.2" x2="276" y2="163.2" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(276,163.2) scale(0.545)"/>
<line x1="332" y1="196.9" x2="332" y2="172.9" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(332,172.9) scale(0.545)"/>
<line x1="388" y1="205.5" x2="388" y2="181.5" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(388,181.5) scale(0.545)"/>
<line x1="444" y1="213.5" x2="444" y2="189.5" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(444,189.5) scale(0.545)"/>

<text x="330" y="120" fill="#4f7a34" font-size="11" font-style="italic" text-anchor="middle">deep-rooted prairie, on the contour</text>

<!-- bar scale -->
<g stroke="#8a7f6a" stroke-width="1.2" fill="none">
  <path d="M26,258 h96"/><path d="M26,254 v8"/><path d="M122,254 v8"/>
</g>
<text x="129" y="261.5" fill="#8a7f6a" font-size="9.5">12 m</text>

<!-- ================= outcomes footprint ================= -->
<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#8a8880" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Ecology</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Water</text>

<polygon points="690,112 720,150 690,200 640,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="112" r="2.2" fill="#2c5580"/>
<circle cx="720" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="200" r="2.2" fill="#2c5580"/>
<circle cx="640" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="234" fill="#7a7973" font-size="9.5" font-style="italic" text-anchor="middle">benefit at the rim, harm at the center</text>
<text x="690" y="246" fill="#8a8880" font-size="9" font-style="italic" text-anchor="middle">dashed ring: no harm either way</text>
</svg>
