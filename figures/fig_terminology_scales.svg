    <path d="M5,-8.4 a2,2 0 1 1 1.6,3.2 z" fill="#4a4740"/>
  </g>
  <clipPath id="pa"><rect x="18" y="42" width="1070" height="302"/></clipPath>
  <clipPath id="pb"><rect x="18" y="392" width="1070" height="298"/></clipPath>
</defs>

