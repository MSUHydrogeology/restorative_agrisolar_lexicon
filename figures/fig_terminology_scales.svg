    <line x1="0" y1="0" x2="3" y2="-6.5" stroke="#6f8a41" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="shrub"><circle cx="0" cy="-5" r="5.2" fill="#8fae5f" stroke="#6f8c46" stroke-width="1" vector-effect="non-scaling-stroke"/></g>
  <g id="house"><polygon points="-11,0 -11,-11 0,-20 11,-11 11,0" fill="#ffffff" stroke="#6b6b63" stroke-width="1.2" stroke-linejoin="round"/></g>
