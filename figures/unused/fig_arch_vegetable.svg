<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Vegetable Agrivoltaics</title>
<desc>Section through a market field, drawn at twelve and a half SVG units to the meter. Four rows stand high enough for hand and small-equipment work and far enough apart to leave the crop its light, and the vegetable rows run unbroken beneath and between them. Sunlight falls from the upper left, and the wide pitch leaves broad sunlit gaps between the bands of shade, which is what the spacing is for. Shaded ground holds moisture the open rows lose. Its outcomes footprint sits at the right: Agriculture nearest the rim, Ecology in toward the center.</desc>

<defs>
  <!-- Shared glyphs. The module is one 3.0 m table, drawn at each figure's own
       scale via transform="... scale(k)". Post height is per instance, because
       clearance is a real design variable. Read heights against the bar scale. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="veg">
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#4f8a2e" stroke-width="1.4"/>
    <path d="M0,-2.8 q-5,-1.4 -5.6,-5.6" fill="none" stroke="#4f8a2e" stroke-width="1.3"/>
    <path d="M0,-2.8 q5,-1.4 5.6,-5.6" fill="none" stroke="#4f8a2e" stroke-width="1.3"/>
    <path d="M0,-5 q-2.8,-3.5 -0.7,-6.3" fill="none" stroke="#4f8a2e" stroke-width="1.2"/>
    <path d="M0,-5 q2.8,-3.5 0.7,-6.3" fill="none" stroke="#4f8a2e" stroke-width="1.2"/>
  </g>
  <clipPath id="soilclipV">
    <path d="M26,200 L545,200 L545,250 L26,250 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A2–A3 scale · S1 siting · structure-led restoration</text>

<!-- sun: fixed position and 45 degree rays in every archetype card -->
<g stroke="#c08a12" stroke-linecap="round">
  <circle cx="62" cy="60" r="8.5" fill="#c08a12" fill-opacity="0.16" stroke-width="1.4"/>
  <g stroke-width="1.6" opacity="0.85">
    <line x1="63" y1="75" x2="72" y2="84"/>
    <line x1="70" y1="68" x2="79" y2="77"/>
    <line x1="77" y1="61" x2="86" y2="70"/>
  </g>
</g>

<!-- ================= soil ================= -->
<path d="M26,200 L545,200 L545,250 L26,250 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclipV)">
  <path d="M26,200 L545,200 L545,213 L26,213 Z" fill="#e0d5bd"/>
  <!-- moisture held where the shade actually falls, not directly under the panel -->
  <path d="M148.6,200 L201.4,200 L201.4,220 L148.6,220 Z" fill="#cfc9b0"/>
  <path d="M260.6,200 L313.4,200 L313.4,220 L260.6,220 Z" fill="#cfc9b0"/>
  <path d="M372.6,200 L425.4,200 L425.4,220 L372.6,220 Z" fill="#cfc9b0"/>
  <path d="M484.6,200 L537.4,200 L537.4,220 L484.6,220 Z" fill="#cfc9b0"/>
  <g fill="#2b7fb0" opacity="0.35">
    <circle cx="162" cy="208" r="1.4"/><circle cx="180" cy="215" r="1.4"/><circle cx="194" cy="206" r="1.4"/>
    <circle cx="274" cy="208" r="1.4"/><circle cx="292" cy="215" r="1.4"/><circle cx="306" cy="206" r="1.4"/>
    <circle cx="386" cy="208" r="1.4"/><circle cx="404" cy="215" r="1.4"/><circle cx="418" cy="206" r="1.4"/>
    <circle cx="498" cy="208" r="1.4"/><circle cx="516" cy="215" r="1.4"/><circle cx="530" cy="206" r="1.4"/>
  </g>
  <g stroke="#b6a274" stroke-width="1" opacity="0.85" fill="none">
    <path d="M59,200 v9"/><path d="M135,200 v9"/><path d="M211,200 v9"/><path d="M287,200 v9"/>
    <path d="M363,200 v9"/><path d="M439,200 v9"/><path d="M515,200 v9"/>
  </g>
</g>
<path d="M26,200 L545,200" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- shade bands, and the sunlit gaps the row pitch buys -->
<g fill="#3d4a55" opacity="0.17">
  <path d="M148.6,200 h52.8 v6 h-52.8 z"/>
  <path d="M260.6,200 h52.8 v6 h-52.8 z"/>
  <path d="M372.6,200 h52.8 v6 h-52.8 z"/>
  <path d="M484.6,200 h52.8 v6 h-52.8 z"/>
</g>

<!-- ================= the crop, unbroken under and between ================= -->
<g>
  <use href="#veg" x="40" y="200"/><use href="#veg" x="59" y="200"/><use href="#veg" x="78" y="200"/>
  <use href="#veg" x="97" y="200"/><use href="#veg" x="116" y="200"/><use href="#veg" x="135" y="200"/>
  <use href="#veg" x="154" y="200"/><use href="#veg" x="173" y="200"/><use href="#veg" x="192" y="200"/>
  <use href="#veg" x="211" y="200"/><use href="#veg" x="230" y="200"/><use href="#veg" x="249" y="200"/>
  <use href="#veg" x="268" y="200"/><use href="#veg" x="287" y="200"/><use href="#veg" x="306" y="200"/>
  <use href="#veg" x="325" y="200"/><use href="#veg" x="344" y="200"/><use href="#veg" x="363" y="200"/>
  <use href="#veg" x="382" y="200"/><use href="#veg" x="401" y="200"/><use href="#veg" x="420" y="200"/>
  <use href="#veg" x="439" y="200"/><use href="#veg" x="458" y="200"/><use href="#veg" x="477" y="200"/>
  <use href="#veg" x="496" y="200"/><use href="#veg" x="515" y="200"/><use href="#veg" x="534" y="200"/>
</g>

<!-- ================= four rows, widely spaced and raised for work beneath ================= -->
<line x1="130" y1="200" x2="130" y2="155" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(130,155) scale(0.852)"/>
<line x1="242" y1="200" x2="242" y2="155" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(242,155) scale(0.852)"/>
<line x1="354" y1="200" x2="354" y2="155" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(354,155) scale(0.852)"/>
<line x1="466" y1="200" x2="466" y2="155" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" transform="translate(466,155) scale(0.852)"/>

<!-- the sunlit gap between two shade bands -->
<g stroke="#c08a12" stroke-width="1" fill="none" opacity="0.8">
  <path d="M201.4,192 L260.6,192"/>
  <path d="M201.4,188 v8"/><path d="M260.6,188 v8"/>
</g>
<text x="231" y="184" fill="#c08a12" font-size="9.5" font-style="italic" text-anchor="middle">sunlit</text>

<text x="112" y="120" fill="#8a7f6a" font-size="11" font-style="italic" text-anchor="middle">room to work beneath</text>
<text x="404" y="120" fill="#4f8a2e" font-size="11" font-style="italic" text-anchor="middle">rows spaced for the crop's light, not for packing</text>

<!-- bar scale -->
<g stroke="#8a7f6a" stroke-width="1.2" fill="none">
  <path d="M26,258 h100"/><path d="M26,254 v8"/><path d="M126,254 v8"/>
</g>
<text x="133" y="261.5" fill="#8a7f6a" font-size="9.5">8 m</text>

<!-- ================= outcomes footprint ================= -->
<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#8a8880" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Ecology</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Water</text>

<polygon points="690,108 740,150 690,178 650,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="108" r="2.2" fill="#2c5580"/>
<circle cx="740" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="178" r="2.2" fill="#2c5580"/>
<circle cx="650" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="234" fill="#7a7973" font-size="9.5" font-style="italic" text-anchor="middle">benefit at the rim, harm at the center</text>
<text x="690" y="246" fill="#8a8880" font-size="9" font-style="italic" text-anchor="middle">dashed ring: no harm either way</text>
</svg>
