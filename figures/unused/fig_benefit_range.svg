<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img">
<title>How each restorative function is delivered</title>
<desc>Delivery by proximity is drawn as concentric bands of distance from the array: on-site, adjacent, and regional and global, with downstream following the water rather than the radius and visits running inward. Delivery by preservation is drawn as a nearby parcel that was never built, since it is proximate but counterfactual. Delivery by channel sits apart, moving along tenure, contract, and jurisdiction rather than any distance.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bt{font-size:12.5px;font-weight:600;fill:#2c2c2a}
.it{font-size:10px;font-style:italic;fill:#8a8880}
.eyebrow{font-size:10px;font-weight:600;fill:#8a8880;letter-spacing:0.06em}
.pt{font-size:11.5px;font-weight:600}
.b1{fill:#eae7dd;stroke:#cfc8b8;stroke-width:1}
.b2{fill:#f4f2eb;stroke:#cfc8b8;stroke-width:1}
.b3{fill:#faf9f5;stroke:#cfc8b8;stroke-width:1}
.on{fill:#8a5a2b}.adj{fill:#4e8a3f}.reg{fill:#2f8f9a}.dwn{fill:#2f77bf}.vis{fill:#c8871f}.pre{fill:#6b6a63}
</style>

<defs>
<marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0,1 L9,5 L0,9 z" fill="#2f77bf"/>
</marker>
<marker id="visit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
  <path d="M0,1.5 L9,5 L0,8.5 z" fill="#c8871f"/>
</marker>
</defs>

<!-- ===== proximity: concentric bands ===== -->
<circle class="b3" cx="300" cy="222" r="182"/>
<circle class="b2" cx="300" cy="222" r="112"/>
<circle class="b1" cx="300" cy="222" r="50"/>

<!-- downstream -->
<path d="M322 244 Q418 316 520 396" stroke="#2f77bf" stroke-width="12" stroke-opacity="0.18" fill="none" stroke-linecap="round"/>
<path d="M322 244 Q418 316 512 392" stroke="#2f77bf" stroke-width="1.8" fill="none" marker-end="url(#flow)"/>
<text class="pt dwn" x="436" y="316">downstream</text>

<!-- visited: movement inward -->
<line x1="26" y1="212" x2="86" y2="212" stroke="#c8871f" stroke-width="1.6" marker-end="url(#visit)"/>
<line x1="26" y1="236" x2="86" y2="236" stroke="#c8871f" stroke-width="1.6" marker-end="url(#visit)"/>
<text class="pt vis" x="24" y="196">visited</text>

<!-- preservation: a nearby parcel that was never built -->
<rect x="376" y="96" width="76" height="50" rx="3" fill="none" stroke="#6b6a63" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="pt pre" x="414" y="82" text-anchor="middle">preservation</text>
<text class="it" x="414" y="164" text-anchor="middle">the parcel not built</text>

<!-- the array -->
<rect x="274" y="207" width="52" height="30" rx="3" fill="#ffffff" stroke="#5f5e5a" stroke-width="1.2"/>
<line x1="283" y1="214" x2="283" y2="230" stroke="#8a8880" stroke-width="1"/>
<line x1="294" y1="214" x2="294" y2="230" stroke="#8a8880" stroke-width="1"/>
<line x1="305" y1="214" x2="305" y2="230" stroke="#8a8880" stroke-width="1"/>
<line x1="316" y1="214" x2="316" y2="230" stroke="#8a8880" stroke-width="1"/>

<!-- band labels -->
<text class="pt reg" x="300" y="70"  text-anchor="middle">regional and global</text>
<text class="pt adj" x="300" y="134" text-anchor="middle">adjacent</text>
<text class="pt on"  x="300" y="192" text-anchor="middle">on-site</text>

<text class="eyebrow" x="300" y="428" text-anchor="middle">DELIVERED BY PROXIMITY</text>

<!-- ===== channel: no geography ===== -->
<line x1="606" y1="40" x2="606" y2="400" stroke="#cfc8b8" stroke-width="1" stroke-dasharray="4 4"/>
<text class="eyebrow" x="632" y="80">NO GEOGRAPHY AT ALL</text>

<text class="bt" x="632" y="118">Delivered by channel</text>
<text class="it" x="632" y="138">the community and economic function</text>

<line x1="632" y1="176" x2="700" y2="176" stroke="#c8871f" stroke-width="1.4" marker-end="url(#visit)"/>
<text class="it" x="712" y="179">the lease</text>
<line x1="632" y1="206" x2="700" y2="206" stroke="#c8871f" stroke-width="1.4" marker-end="url(#visit)"/>
<text class="it" x="712" y="209">the tax roll</text>
<line x1="632" y1="236" x2="700" y2="236" stroke="#c8871f" stroke-width="1.4" marker-end="url(#visit)"/>
<text class="it" x="712" y="239">the subscription</text>
<line x1="632" y1="266" x2="700" y2="266" stroke="#c8871f" stroke-width="1.4" marker-end="url(#visit)"/>
<text class="it" x="712" y="269">the payroll</text>

<text class="it" x="632" y="316">A route, not a radius.</text>
</svg>
