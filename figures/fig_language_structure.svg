<svg xmlns="http://www.w3.org/2000/svg" width="912" height="578" viewBox="14 38 912 578" role="img">
<title>How the design language fits together</title>
<desc>Top row: nine design pressures, drawn as the four-wedge disc from the pressures chapter, push on a bank of six levers. Three pressures push toward restoration, three push away, and three go either way. The levers are scale, siting, structure, management, ownership, and contracts, and each carries the color of the restorative work it can lead, scale included. Bottom row: what a lever setting produces. A position on the scale transect from A1 to A5, a position on the farming axis from S0 to S5, the lever that leads the restorative work, and the restorative functions, read as a footprint across Communities, Agriculture, Water, and Ecology that runs from causing harm at the center out to promoting benefit at the rim.</desc>
