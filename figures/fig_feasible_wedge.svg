<svg xmlns="http://www.w3.org/2000/svg" width="796" height="392" viewBox="-36 0 796 392" role="img">
<title>Which combinations of scale and farming position actually get built</title>
<desc>A centered sharing-sparing axis with five positions. Primary and secondary agriculture (S1-S2) sit above the scale line, ordinary-land siting (S3) sits on it, and low-productivity and impaired-land siting (S4-S5) sit below. The feasible region is not a lens. It is flat along the top from A1 to A5, because a farm can carry on under panels at any size: at the small end it is the operator's own yard, and at the large end it is a contracted flock on ground that was already pasture. It opens downward from A1 to A3 as sparing becomes worth doing, and stays open to A5. Light hatching at the small end marks sparing that is possible but too small to matter. A dense hatched wedge at the large end marks low-productivity siting thinning toward A5, because idle remnants are scattered and land assembly cannot collect them. Solid points are practices you can go and look at; hollow points are exceptions that reopen a corner the rest of the evidence says is shut.</desc>
<defs>
<pattern id="hatchL" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#8f8d84" stroke-width="1"/></pattern>
<pattern id="hatchD" width="3.5" height="3.5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="3.5" stroke="#8f8d84" stroke-width="1"/></pattern>
</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:13.5px;fill:#5f5e5a}.rl{font-size:13.5px;font-weight:600;fill:#3d3d3a}
.s1{fill:#1c4c73}.s2{fill:#2f6b96}.s3{fill:#6f6d66}.s4{fill:#6a4a91}.s5{fill:#46295f}
.an{font-size:11.5px;fill:#7a7973}
.ex{font-size:12.5px;font-style:italic;fill:#993C1D}.gy{font-size:12.5px;font-style:italic;fill:#6f6e68}
.dir{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#1c4c73}
.dir2{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#46295f}
.ctr{font-size:12px;font-weight:600;letter-spacing:.04em;fill:#6f6e68}
.ax{stroke:#b4b2a9;stroke-width:1}.cen{stroke:#9c9a92;stroke-width:1;stroke-dasharray:4 4}
</style>

<!-- sparing at the small end: available, and not worth much -->
<polygon points="152,198 440,318 152,318" fill="url(#hatchL)" opacity="0.7"/>

<!-- the feasible region: flat along the sharing edge, opening downward to A3 -->
<polygon points="152,74 725,74 725,318 440,318 152,198" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>

<!-- low-productivity siting thins toward A5: remnants are scattered and assembly cannot collect them -->
<polygon points="497,262 725,230 725,294" fill="url(#hatchD)" opacity="0.9"/>

<line class="ax" x1="152" y1="50" x2="152" y2="334"/>
<line class="ax" x1="138" y1="198" x2="740" y2="198"/>
<line class="cen" x1="152" y1="198" x2="725" y2="198"/>
<text class="dir" x="140" y="56" text-anchor="end">SHARING &#8593;</text>
<text class="dir2" x="140" y="338" text-anchor="end">SPARING &#8595;</text>
<text class="rl s1" x="142" y="78" text-anchor="end">S1 primary agriculture</text>
<text class="rl s2" x="142" y="140" text-anchor="end">S2 secondary agriculture</text>
<text class="rl s3" x="142" y="195" text-anchor="end">S3 ordinary-land siting</text>
<text class="ctr" x="142" y="210" text-anchor="end">neither</text>
<text class="rl s4" x="142" y="262" text-anchor="end">S4 low-productivity siting</text>
<text class="rl s5" x="142" y="322" text-anchor="end">S5 impaired-land siting</text>
<text class="ts" x="152" y="358" text-anchor="middle">A1</text><text class="an" x="152" y="373" text-anchor="middle">Farmstead</text>
<text class="ts" x="296" y="358" text-anchor="middle">A2</text><text class="an" x="296" y="373" text-anchor="middle">Commercial</text>
<text class="ts" x="440" y="358" text-anchor="middle">A3</text><text class="an" x="440" y="373" text-anchor="middle">Community</text>
<text class="ts" x="583" y="358" text-anchor="middle">A4</text><text class="an" x="583" y="373" text-anchor="middle">Utility</text>
<text class="ts" x="725" y="358" text-anchor="middle">A5</text><text class="an" x="725" y="373" text-anchor="middle">Complex</text>

<text class="gy" x="300" y="52" text-anchor="middle">the farming carries on at every size</text>
<text class="gy" x="286" y="303" text-anchor="middle">sparing here spares very little</text>
<text class="gy" x="648" y="278" text-anchor="middle">remnants will not assemble</text>

<circle cx="182" cy="88" r="5.5" fill="#D85A30"/><text class="ts" x="182" y="106" text-anchor="middle" fill="#993C1D">barnyard shelter</text>
<circle cx="404" cy="88" r="5.5" fill="#D85A30"/><text class="ts" x="417" y="84" text-anchor="start" fill="#993C1D">vegetables</text>
<circle cx="655" cy="105" r="5.5" fill="#D85A30"/><text class="ts" x="655" y="126" text-anchor="middle" fill="#993C1D">grazing enterprise</text>
<circle cx="440" cy="120" r="5.5" fill="#D85A30"/><text class="ts" x="440" y="141" text-anchor="middle" fill="#993C1D">contract grazing</text>
<circle cx="282" cy="198" r="5.5" fill="#D85A30"/><text class="ts" x="282" y="216" text-anchor="middle" fill="#993C1D">lease income</text>
<circle cx="612" cy="198" r="5.5" fill="#D85A30"/><text class="ts" x="612" y="216" text-anchor="middle" fill="#993C1D">native grassland</text>
<circle cx="404" cy="262" r="5.5" fill="#D85A30"/><text class="ts" x="404" y="251" text-anchor="middle" fill="#993C1D">marginal land</text>
<circle cx="466" cy="304" r="5.5" fill="#D85A30"/><text class="ts" x="466" y="322" text-anchor="middle" fill="#993C1D">solar prairie strips</text>
<circle cx="700" cy="312" r="5.5" fill="#D85A30"/><text class="ts" x="700" y="332" text-anchor="middle" fill="#993C1D">retired irrigation</text>

<circle cx="296" cy="98" r="5.5" fill="none" stroke="#D85A30" stroke-width="1.5"/><text class="ex" x="296" y="120" text-anchor="middle">greenhouse PV</text>
<circle cx="556" cy="80" r="5.5" fill="none" stroke="#D85A30" stroke-width="1.5"/><text class="ex" x="556" y="69" text-anchor="middle">vertical bifacial</text>
<circle cx="640" cy="248" r="5.5" fill="none" stroke="#D85A30" stroke-width="1.5"/><text class="ex" x="640" y="237" text-anchor="middle">brightfield</text>
</svg>
