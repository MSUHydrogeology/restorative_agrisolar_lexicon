<svg xmlns="http://www.w3.org/2000/svg" width="592" height="444" viewBox="124 68 592 444" role="img">
<title>The outcomes footprint: a project read across four domains and eight outcomes</title>
<desc>A radial plot with four domains, one for each restorative function, and two outcomes inside each. Communities carries financial security and livability. Agriculture carries food production and soil quality. Water carries quantity and quality. Ecology carries diversity and connectivity. Every spoke runs from causing harm at the center, through a dashed ring where the domain is left no worse than it was found, out to promoting benefit at the rim, so a bigger footprint is a better project. The ring marks where the sign changes rather than a standard a project is expected to clear. The shaded polygon is a worked example rather than a measurement.</desc>
