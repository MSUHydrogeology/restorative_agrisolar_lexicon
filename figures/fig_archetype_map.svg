<svg xmlns="http://www.w3.org/2000/svg" width="922" height="800" viewBox="0 0 922 800" role="img">
<title>Where the archetypes sit, and which lever does their work</title>
<desc>A grid with the five ground-taking zones of the scale transect across the top, A1 Farmstead to A5 Complex, and the six farming-axis positions down the side, S0 Created agriculture at the top through S5 Impaired-land siting at the bottom. Each of the thirteen archetypes is drawn as a bar spanning the zones it recurs at, in the row of its farming-axis position, colored by its restoration mode. Filled bars are the six featured archetypes, outlined bars the seven sketched ones, and dashed bars a position a form takes only in some cases. The primary-agriculture row runs from A1 to A5, carried at the small end by barnyard shelter and crop canopies and at the large end by grazing. Hatched cells mark combinations that rarely get built: sparing at A1, and impaired-land siting at A2, where the acreage spares almost nothing, and low-productivity siting at A5, where scattered remnants will not assemble and only brightfields reach. Every clear cell is possible, including created agriculture at any size. Nine of the thirteen forms reach A3. Read left to right, the colors shift from ownership and structure at the small end, through siting in the middle, to management and contracts at the large end.</desc>
