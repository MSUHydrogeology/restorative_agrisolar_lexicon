<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="392" viewBox="0 0 1106 392" role="img">
<title>How an archetype emerges</title>
<desc>A curve read like a potential-energy landscape. The vertical axis is design tension, highest at the top. The horizontal axis is the design pressures, where a position along it is one way the nine can come out, ordered by which lever the restorative work fell to. The curve has six low spots, each named for the form that sits in it and carrying that form's scale, siting, and restoration-mode code: barnyard shelter solar, perennial crop canopy, regenerative solar grazing, marginal land solar, solar prairie strips, and retired-irrigation solar. Projects are drawn as balls resting at the bottom of each low spot, more of them in the deeper ones. A second dashed curve shows the same landscape where the region is arid: the retired-irrigation basin becomes much the deepest on the curve, perennial crop canopy deepens because shade is worth more where it is hot and dry, and the prairie strips basin flattens almost away.</desc>
