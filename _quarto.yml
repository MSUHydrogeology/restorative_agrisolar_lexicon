project:
  type: book
  output-dir: _site
  render:
    - "*.qmd"

book:
  title: "The Lexicon of Restorative Agrisolar Design"
  subtitle: "A shared design language for agrisolar photovoltaic landscapes"
  author:
    - "Anthony Kendall"
    - "Aaron Thompson"
  date: last-modified
  site-url: "https://msuhydrogeology.github.io/restorative_agrisolar_lexicon/"
  repo-url: "https://github.com/MSUHydrogeology/restorative_agrisolar_lexicon"
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - chapters/design-levers.qmd
    - chapters/design-pressures.qmd
    - chapters/scale-transect.qmd
    - chapters/farming-axis.qmd
    - chapters/restoration-modes.qmd
    - chapters/restorative-functions.qmd
    - chapters/archetypal-forms.qmd
    - chapters/terminology.qmd
    - chapters/evidence-and-needs.qmd
    - chapters/sources.qmd
  appendices:
    - chapters/index-alphabetical.qmd
  downloads: [pdf]

bibliography: references.bib

# Chapters, sections, and figures are numbered by Quarto from their order in
# `chapters:` above. Nothing is hand-numbered. Prose cites a section as
# §-@sec-anchor, which renders the bare number after the §, and a figure as
# @fig-slug. index.qmd is an unnumbered preface, which is what keeps chapter 1
# from being counted as chapter 2. number-depth: 2 leaves glossary terms,
# archetypes, and the A-Z index headings unnumbered.
crossref:
  chapters: true
format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    number-sections: true
    number-depth: 2
    toc: true
    toc-depth: 3
